## 1. Sample `Dockerfile`

A minimal Node.js app image (swap the base image if you use Python, Go, etc.).

```dockerfile
# ---- Build stage ----
FROM node:20-alpine AS build
WORKDIR /app

COPY package*.json ./
RUN npm ci --omit=dev

COPY . .

# ---- Runtime stage ----
FROM node:20-alpine AS runtime
WORKDIR /app

ENV NODE_ENV=production
ENV PORT=80

COPY --from=build /app ./

EXPOSE 80
CMD ["node", "server.js"]
```

Minimal `server.js` to match:

```js
const http = require("http");
const port = process.env.PORT || 80;

http.createServer((req, res) => {
  res.writeHead(200, { "Content-Type": "text/plain" });
  res.end("Hello from ECS\n");
}).listen(port, () => console.log(`Listening on ${port}`));
```

Build test locally:

```bash
docker build -t my-app:local .
docker run --rm -p 8080:80 my-app:local
```

