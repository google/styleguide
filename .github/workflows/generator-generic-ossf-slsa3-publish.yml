      upload-assets: ${{ github.event_name == 'release' }}
```

### What changed vs. the original

| Change | Why |
|---|---|
| `@v1.4.0` → `@v2.0.0` | Current stable generator line; older versions are stale. |
| Added `permissions` on `build` | Least privilege — it only needs to read the repo. |
| Added top-level `permissions: read-all` | Safe default; the `provenance` job overrides as needed. |
| `upload-assets` is now conditional | Prevents failure on manual `workflow_dispatch` when no release exists. |
| Replaced `ls artifact*` with `find` + validation | Robust if no matching files exist. |
| Left `actions/checkout@v4` as a tag | Works, but for full SLSA L3 self-verification, pin it to a commit SHA. |

### Important note on pinning
For the **generator itself** to be considered SLSA L3-trusted, the reusable workflow should be pinned to a **full 40-character commit SHA**, not a tag. Tags like `@v2.0.0` are convenient and functional, but they can be moved. If you need that level of assurance, replace:

```yaml
uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
```

with the SHA from the v2.0.0 release.

