## What this workflow is
It’s the standard **SLSA Level 3 provenance generator** for GitHub Actions. It builds artifacts, hashes them, then calls the reusable `slsa-github-generator` workflow to sign provenance via OIDC/Sigstore and optionally upload it to a release.

## How it works
1. **`build` job**
   - Checks out the repo.
   - Builds artifacts (`artifact1`, `artifact2`).
   - Generates base64-encoded SHA-256 digests as an output.
2. **`provenance` job**
   - Depends on `build`.
   - Calls `slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0`.
   - Signs and uploads provenance.

## Problems / improvements
1. **Old generator version** — `v1.4.0` is stale; use `v2.0.0` or, ideally, a full commit SHA.
2. **Missing least-privilege permissions** on `build` — add `permissions: contents: read`.
3. **`upload-assets: true` breaks on `workflow_dispatch`** — there may be no release to upload to.
4. **Fragile artifact glob** — `ls artifact*` fails if nothing matches; use `find` and validate.
5. **Pin `actions/checkout`** to a SHA for stronger SLSA guarantees.
6. **Optional** — set `provenance-name` to customize the output filename.

